[build]
command = "yarn locales && next build"
functions = "netlify/functions"
publish = ".next"

[images]
remote_images = ['https://www\.datocms-assets\.com/.*', 'https://image\.mux\.com/.*']

[[redirects]]
from = "/_next/image"
query = { url = ":url", w = ":w", q = ":q" }
to = "/.netlify/images?url=:url&w=:w&q=:q"
status = 200
